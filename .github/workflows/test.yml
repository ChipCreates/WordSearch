name: Test

# Runs the test suites that exist in this repo (Vitest + tsc for the
# TypeScript side, cargo test for the Rust side) on every push and PR.
# Kept separate from release.yml/deploy-web.yml -- a flaky or failing test
# run should never block a tag-triggered release or a web deploy, and this
# workflow shouldn't have to wait on either of those to start.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: cargo test --manifest-path src-tauri/Cargo.toml
